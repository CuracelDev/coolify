services:
  coolify-staging:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    image: coolify-staging-app:local
    container_name: coolify-staging-app
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - coolify-staging
    env_file:
      - ./.env.coolify-staging
    environment:
      APP_ENV: ${APP_ENV:-staging}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_FPM_PM_CONTROL: ${PHP_FPM_PM_CONTROL:-dynamic}
      PHP_FPM_PM_START_SERVERS: ${PHP_FPM_PM_START_SERVERS:-1}
      PHP_FPM_PM_MIN_SPARE_SERVERS: ${PHP_FPM_PM_MIN_SPARE_SERVERS:-1}
      PHP_FPM_PM_MAX_SPARE_SERVERS: ${PHP_FPM_PM_MAX_SPARE_SERVERS:-10}
    volumes:
      - type: bind
        source: ./.env.coolify-staging
        target: /var/www/html/.env
        read_only: true
      - coolify-staging-ssh:/var/www/html/storage/app/ssh
      - coolify-staging-applications:/var/www/html/storage/app/applications
      - coolify-staging-databases:/var/www/html/storage/app/databases
      - coolify-staging-services:/var/www/html/storage/app/services
      - coolify-staging-backups:/var/www/html/storage/app/backups
    ports:
      - "${APP_PORT:-8001}:8080"
    expose:
      - "${APP_PORT:-8001}"
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/api/health || exit 1
      interval: 5s
      retries: 10
      timeout: 2s
    depends_on:
      coolify-staging-db:
        condition: service_healthy
      coolify-staging-redis:
        condition: service_healthy
      coolify-staging-realtime:
        condition: service_healthy

  coolify-staging-db:
    image: postgres:15-alpine
    container_name: coolify-staging-db
    restart: always
    networks:
      - coolify-staging
    env_file:
      - ./.env.coolify-staging
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-coolify_staging}
    volumes:
      - coolify-staging-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE:-coolify_staging}"]
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-staging-redis:
    image: redis:7-alpine
    container_name: coolify-staging-redis
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    networks:
      - coolify-staging
    env_file:
      - ./.env.coolify-staging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - coolify-staging-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 5s
      retries: 10
      timeout: 2s

  coolify-staging-realtime:
    build:
      context: .
      dockerfile: docker/coolify-realtime/Dockerfile
    image: coolify-staging-realtime:local
    container_name: coolify-staging-realtime
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - coolify-staging
    env_file:
      - ./.env.coolify-staging
    environment:
      APP_NAME: ${APP_NAME:-Coolify Staging}
      SOKETI_DEBUG: ${SOKETI_DEBUG:-false}
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_HOST: ${SOKETI_HOST:-0.0.0.0}
    volumes:
      - coolify-staging-ssh:/var/www/html/storage/app/ssh
    ports:
      - "${SOKETI_PORT:-6001}:6001"
      - "${SOKETI_METRICS_PORT:-6002}:6002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6001/ready && wget -qO- http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      retries: 10
      timeout: 2s

volumes:
  coolify-staging-ssh:
    name: coolify-staging-ssh
  coolify-staging-applications:
    name: coolify-staging-applications
  coolify-staging-databases:
    name: coolify-staging-databases
  coolify-staging-services:
    name: coolify-staging-services
  coolify-staging-backups:
    name: coolify-staging-backups
  coolify-staging-db-data:
    name: coolify-staging-db-data
  coolify-staging-redis-data:
    name: coolify-staging-redis-data

networks:
  coolify-staging:
    name: coolify-staging
    driver: bridge
    external: false
